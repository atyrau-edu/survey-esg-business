<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЕО / ЕС — сауалнама · опрос</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1c1e; --muted:#5f636a;
  --line:#dcdad4; --accent:#1c4f8c; --accent-soft:#e8eef7;
  --warn:#7b4b1e; --ok:#1f6b4a; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1e2125; --ink:#e9e8e4; --muted:#a2a7ae;
    --line:#333840; --accent:#7fa9de; --accent-soft:#232b36;
    --warn:#d3a373; --ok:#7ec8a2;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1e2125; --ink:#e9e8e4; --muted:#a2a7ae;
  --line:#333840; --accent:#7fa9de; --accent-soft:#232b36;
  --warn:#d3a373; --ok:#7ec8a2;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Arial,sans-serif;
  font-size:16px; line-height:1.5;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 72px}
header.bar{
  position:sticky; top:0; z-index:5; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 0 8px; margin-bottom:18px;
}
.barin{max-width:760px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:12px}
.org{font-size:12px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.progwrap{height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:8px}
.prog{height:100%; width:0; background:var(--accent); transition:width .25s ease}
h1{font-size:23px; line-height:1.28; margin:0 0 10px; font-weight:650}
h2{font-size:17px; margin:26px 0 4px; font-weight:650; color:var(--accent)}
p{margin:0 0 12px}
.lead{color:var(--muted); font-size:14.5px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px 6px; margin-bottom:14px}
.qnum{font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; letter-spacing:.02em}
.qtext{font-weight:600; margin:2px 0 10px}
.hint{font-size:13.5px; color:var(--muted); margin:-4px 0 10px}
label.opt{
  display:flex; gap:10px; align-items:flex-start; padding:9px 10px; margin:0 0 6px;
  border:1px solid var(--line); border-radius:8px; cursor:pointer; background:transparent;
}
label.opt:hover{background:var(--accent-soft)}
label.opt input{margin-top:3px; flex:none; accent-color:var(--accent)}
label.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.scale{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.scale button{
  flex:1 1 52px; min-width:52px; padding:11px 4px; font-size:15px; font-weight:600;
  border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); cursor:pointer;
}
.scale button.sel{background:var(--accent); border-color:var(--accent); color:#fff}
.scale button.dk{flex:1 1 100%; font-weight:500; font-size:13.5px; color:var(--muted)}
.scale button.dk.sel{color:#fff}
.ends{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin:-2px 0 12px; gap:10px}
.grid-row{border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px}
.grid-row .lbl{font-size:15px; margin-bottom:8px}
.grid-opts{display:flex; gap:6px; flex-wrap:wrap}
.grid-opts button{
  flex:1 1 30%; min-width:92px; padding:8px 6px; font-size:12.5px; line-height:1.25;
  border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--ink); cursor:pointer;
}
.grid-opts button.sel{background:var(--accent); border-color:var(--accent); color:#fff}
select,textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px;
}
textarea{min-height:96px; resize:vertical}
.rank{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.rank span{font-size:13px; color:var(--muted); width:28px; flex:none}
.nav{display:flex; gap:10px; margin-top:18px}
button.go{
  flex:1; padding:13px; font-size:16px; font-weight:600; border-radius:9px; cursor:pointer;
  background:var(--accent); color:#fff; border:1px solid var(--accent);
}
button.back{flex:0 0 96px; background:transparent; color:var(--muted); border:1px solid var(--line)}
button.go:disabled{opacity:.5; cursor:not-allowed}
.langbtn{
  display:block; width:100%; text-align:left; padding:16px; margin-bottom:10px; font:inherit;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); color:var(--ink); cursor:pointer;
}
.langbtn:hover{border-color:var(--accent); background:var(--accent-soft)}
.langbtn b{display:block; font-size:18px; margin-bottom:2px}
.langbtn small{color:var(--muted)}
.note{font-size:13.5px; color:var(--warn); margin:8px 0 12px}
.warnbox{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:6px; padding:10px 12px; font-size:13.5px; color:var(--muted); margin-bottom:14px}
.done{text-align:center; padding:40px 10px}
.done .tick{font-size:40px; color:var(--ok); margin-bottom:10px}
.small{font-size:13px; color:var(--muted)}
.err{color:#b3261e; font-size:13.5px}
@media (max-width:480px){ h1{font-size:20px} .card{padding:15px 14px 4px} }
</style>
</head>

<header class="bar" id="bar" hidden>
  <div class="barin">
    <div class="org" id="orgline"></div>

  <div class="barin"><div class="progwrap" style="flex:1"><div class="prog" id="prog"></div></div></div>

 ]},

 {block:P("Блок 4. Спрос на обучение","4-блок. Оқуға деген сұраныс","Block 4. Demand for training"), qs:[
  {id:"b11",type:"scale",t:P("Насколько вероятно, что Ваша организация направила бы сотрудников на такой модуль в Атырауском университете?","Ұйымыңыз Атырау университетіндегі осындай модульге қызметкерлерін жіберуі қаншалықты ықтимал?","How likely is it that your organisation would send employees to such a module at Atyrau University?")},

   P("Да, в свободной форме","Иә, еркін нысанда","Yes, in free form"),
   P("Нет","Жоқ","No"),

  {id:"b15",type:"multi",max:6,t:P("Готова ли Ваша организация участвовать в образовательном проекте?","Ұйымыңыз білім беру жобасына қатысуға дайын ба?","Would your organisation take part in an educational project?"),o:[
   P("Принять студентов на практику","Студенттерді тәжірибеге қабылдау","Host students for placements"),

/* ===================== CONFIG =====================
   Set these two before deploying to your own hosting.
   ENDPOINT: the Apps Script web app URL (ends with /exec)
   SECRET:   the same string as SECRET in Code.gs           */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbyrDGPE3QVhmQOgmfFdLq0Ge5a_HotcXAeCQJGZJ_oMvLP9vUw07LeC7n8IWhzlJq8/exec",
  SECRET:   "BELGIUM2026",
  VERSION:  "web-B-1.0"
};
/* On claude.ai the page runs in review mode: no network call is made,
   and no response is recorded. On your own hosting it posts to ENDPOINT. */
const PREVIEW = /(^|\.)claude\.ai$/.test(location.hostname)
             || CONFIG.ENDPOINT.indexOf("PASTE_") === 0;

/* ===================== STATE ===================== */
let lang = null, step = -1, minStep = 0, submitted = false;
const A = {};                       // answers
const started = new Date().toISOString();
const startedMs = Date.now();
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const L = (o)=> o && (o[lang] || o.ru || '');

/* ===================== RENDER ===================== */
function render(){
  window.scrollTo(0,0);
  if(step === -1){ renderLang(); return; }
  bar.hidden = false;
  document.getElementById('orgline').textContent = L(T.org);
  const sw = document.getElementById('langswitch');
  sw.textContent = {ru:'ҚАЗ / ENG',kz:'РУС / ENG',en:'ҚАЗ / РУС'}[lang];
  sw.onclick = ()=>{ if(confirm({ru:'Сменить язык? Ответы сохранятся.',kz:'Тілді ауыстыру керек пе? Жауаптар сақталады.',en:'Change language? Answers are kept.'}[lang])){ step=-1; render(); } };
  document.getElementById('prog').style.width = Math.round((step/(SCREENS.length+1))*100)+'%';
  if(step === 0){ renderConsent(); return; }
  if(step > SCREENS.length){ renderDone(); return; }
  renderScreen(SCREENS[step-1]);
}

function renderLang(){
  bar.hidden = true;
  app.innerHTML = '';
  const h = el('h1', 'Сауалнама · Опрос · Survey');
  const p = el('p','Атырау университеті · Атырауский университет'); p.className='lead';
  app.append(h,p);
  const opts = [
    {code:'kz', name:'Қазақша', sub:'Сауалнаманы қазақ тілінде толтыру'},
    {code:'ru', name:'Русский', sub:'Пройти опрос на русском языке'},
    {code:'en', name:'English', sub:'Take the survey in English'}
  ];
  const box = el('div'); box.style.marginTop='18px';
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className='langbtn';
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = o.name;
    b.querySelector('small').textContent = o.sub;
    b.onclick = ()=>{ lang=o.code; document.documentElement.lang=o.code; if(step===-1) step=0; render(); };
    box.append(b);
  });
  app.append(box);
  const n = el('p','~12 min · анонимно · анонимді · anonymous'); n.className='small'; n.style.marginTop='18px';
  app.append(n);
}

function renderConsent(){
  app.innerHTML='';
  app.append(el('h1', L(T.title)));
  if(PREVIEW){ const w=el('div', L(T.previewBanner)); w.className='warnbox'; app.append(w); }
  const c = el('div'); c.className='card';
  c.append(el('h2', L(CONSENT[lang] ? {ru:CONSENT.ru.h,kz:CONSENT.kz.h,en:CONSENT.en.h} : {})));
  CONSENT[lang].b.forEach(t=> c.append(el('p',t)));
  app.append(c);
  nav(false);
}

function renderScreen(sc){
  app.innerHTML='';
  app.append(el('h2', L(sc.block)));
  if(sc.intro){ const w=el('div'); w.className='warnbox'; w.textContent=L(sc.intro); app.append(w); }
  if(sc.lock){ const w=el('div'); w.className='note'; w.textContent=L(T.locknote); app.append(w); }
  sc.qs.forEach(q=> app.append(qcard(q)));
  nav(!!sc.lock || step<=minStep);
}

function qcard(q){
  const c = el('div'); c.className='card';
  const n = el('div', q.id.replace(/^q/,'').replace('_','.')); n.className='qnum';
  const t = el('div', L(q.t)); t.className='qtext';
  c.append(n,t);
  if(q.hint){ const h=el('div',L(q.hint)); h.className='hint'; c.append(h); }
  if(q.type==='single' || q.type==='multi') c.append(optList(q));
  if(q.type==='scale') c.append(scaleWidget(q));
  if(q.type==='grid') c.append(gridWidget(q));
  if(q.type==='rank3') c.append(rankWidget(q));
  if(q.type==='text') c.append(textWidget(q));
  return c;
}

function optList(q){
  const box = el('div');
  const multi = q.type==='multi';
  if(multi) A[q.id] = A[q.id] || [];
  q.o.forEach((op,i)=>{
    const lab = document.createElement('label'); lab.className='opt';
    const inp = document.createElement('input');
    inp.type = multi?'checkbox':'radio'; inp.name=q.id;
    const val = i+1;
    inp.checked = multi ? A[q.id].includes(val) : A[q.id]===val;
    if(inp.checked) lab.classList.add('sel');
    inp.onchange = ()=>{
      if(multi){
        const cur = A[q.id];
        if(inp.checked){
          if(q.max && cur.length>=q.max){ inp.checked=false; flash(box, L(T.maxsel)+' ('+q.max+')'); return; }
          cur.push(val);
        } else { A[q.id]=cur.filter(v=>v!==val); }
      } else { A[q.id]=val; }
      [...box.querySelectorAll('label.opt')].forEach(l=> l.classList.toggle('sel', l.querySelector('input').checked));
    };
    const sp = el('span', L(op));
    lab.append(inp, sp); box.append(lab);
  });
  return box;
}

function scaleWidget(q){
  const box = el('div');
  const row = el('div'); row.className='scale';
  const mk=(v,label,cls)=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=label;
    if(cls) b.className=cls;
    if(A[q.id]===v) b.classList.add('sel');
    b.onclick=()=>{ A[q.id]=v; [...row.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
    return b;
  };
  [1,2,3,4,5].forEach(v=> row.append(mk(v,String(v))));
  row.append(mk(0, L(T.dk), 'dk'));
  const ends = el('div'); ends.className='ends';
  ends.append(el('span','1 — '+L(T.scLo)), el('span','5 — '+L(T.scHi)));
  box.append(row, ends);
  return box;
}

function gridWidget(q){
  const box = el('div');
  A[q.id] = A[q.id] || {};
  q.rows.forEach(r=>{
    const w = el('div'); w.className='grid-row';
    const lb = el('div', L(r.t)); lb.className='lbl';
    const opts = el('div'); opts.className='grid-opts';
    [['A',T.gA],['B',T.gB],['C',T.gC]].forEach(([code,txt])=>{
      const b=document.createElement('button'); b.type='button'; b.textContent=L(txt);
      if(A[q.id][r.k]===code) b.classList.add('sel');
      b.onclick=()=>{ A[q.id][r.k]=code; [...opts.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
      opts.append(b);
    });
    w.append(lb,opts); box.append(w);
  });
  return box;
}

function rankWidget(q){
  const box = el('div');
  A[q.id] = A[q.id] || [null,null,null];
  for(let i=0;i<3;i++){
    const row = el('div'); row.className='rank';
    row.append(el('span',(i+1)+'.'));
    const s=document.createElement('select');
    const blank=document.createElement('option'); blank.value=''; blank.textContent='—'; s.append(blank);
    q.o.forEach((op,j)=>{ const o=document.createElement('option'); o.value=String(j+1); o.textContent=L(op); s.append(o); });
    s.value = A[q.id][i] ? String(A[q.id][i]) : '';
    s.onchange = ()=>{ A[q.id][i] = s.value ? Number(s.value) : null; };
    row.append(s); box.append(row);
  }
  return box;
}

function textWidget(q){
  const ta=document.createElement('textarea');
  ta.value = A[q.id]||'';
  ta.oninput = ()=>{ A[q.id]=ta.value; };
  return ta;
}

function nav(noBack){
  const n = el('div'); n.className='nav';
  if(!noBack && step>0){
    const b=document.createElement('button'); b.className='go back'; b.textContent=L(T.back);
    b.onclick=()=>{ step=Math.max(minStep,step-1); render(); };
    n.append(b);
  }
  const g=document.createElement('button'); g.className='go';
  const last = step===SCREENS.length;
  g.textContent = last ? L(T.submit) : L(T.next);
  g.onclick = ()=>{
    const sc = SCREENS[step-1];
    if(sc && sc.lock) minStep = step+1;
    if(last){ submit(g); return; }
    step++; render();
  };
  n.append(g);
  app.append(n);
}

function renderDone(){
  app.innerHTML='';
  const d=el('div'); d.className='done';
  d.append(el('div','✓')); d.firstChild.className='tick';
  d.append(el('h1', L(T.thanks)));
  const p=el('p', PREVIEW ? L(T.previewDone) : (submitted ? L(T.thanksSub) : L(T.saveFail))); p.className='lead';
  d.append(p);
  if(!submitted && !PREVIEW){
    const b=document.createElement('button'); b.className='go'; b.style.maxWidth='320px'; b.style.margin='12px auto';
    b.textContent=L(T.saveFile);
    b.onclick=()=>saveFile();
    d.append(b);
  }
  app.append(d);
  document.getElementById('prog').style.width='100%';
}

/* ===================== SUBMIT ===================== */
/* Flatten answers into one row, per the codebook:
   single  -> option index (1..n)
   multi   -> one binary column per option: q__oN = 0/1
   grid    -> one column per row key: q__key = A|B|C
   rank3   -> three columns: q__1, q__2, q__3 = option index
   scale   -> 1..5, or 0 for "don't know"
   text    -> raw string                                        */
function flatten(){
  const row = {};
  SCREENS.forEach(sc=> sc.qs.forEach(q=>{
    const v = A[q.id];
    if(q.type==='single' || q.type==='scale'){ row[q.id] = (v==null? '' : v); }
    else if(q.type==='multi'){ q.o.forEach((_,i)=>{ row[q.id+'__o'+(i+1)] = (v&&v.includes(i+1))?1:0; }); }
    else if(q.type==='grid'){ q.rows.forEach(r=>{ row[q.id+'__'+r.k] = (v&&v[r.k])||''; }); }
    else if(q.type==='rank3'){ for(let i=0;i<3;i++) row[q.id+'__'+(i+1)] = (v&&v[i])||''; }
    else if(q.type==='text'){ row[q.id] = (v||'').trim(); }
  }));
  return row;
}

function payload(){
  return {
    secret: CONFIG.SECRET,
    meta: {
      lang, started, finished:new Date().toISOString(),
      elapsed_s: Math.round((Date.now()-startedMs)/1000),
      ua_lang:(navigator.language||''),
      screen_w: window.innerWidth,
      instrument:"B", version:CONFIG.VERSION
    },
    row: flatten()
  };
}

async function submit(btn){
  btn.disabled=true; btn.textContent=L(T.sending);

  /* honeypot: filled means a bot; elapsed guard: under 45s means not a real pass */
  const hp = document.getElementById('hp-field');
  const tooFast = (Date.now()-startedMs) < 45000;
  if((hp && hp.value) || tooFast){ submitted = PREVIEW; step=SCREENS.length+1; render(); return; }

  if(PREVIEW){ submitted = true; step=SCREENS.length+1; render(); return; }

  try{
    const res = await fetch(CONFIG.ENDPOINT, {
      method:'POST', mode:'cors', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // avoids CORS preflight
      body: JSON.stringify(payload())
    });
    const out = await res.json();
    submitted = !!(out && out.ok);
  }catch(e){ submitted = false; }

  if(!submitted){ try{ localStorage.setItem('pending_'+Date.now(), JSON.stringify(payload())); }catch(e){} }
  step = SCREENS.length+1;
  render();
}

async function saveFile(){
  const data = JSON.stringify(payload(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'survey-response-'+Date.now()+'.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ===================== UTIL ===================== */
function el(tag, text){ const e=document.createElement(tag); if(text!=null) e.textContent=text; return e; }
function flash(node,msg){
  let w=node.querySelector('.err');
  if(!w){ w=el('div',''); w.className='err'; node.append(w); }
  w.textContent=msg; setTimeout(()=>{ if(w) w.textContent=''; },2200);
}

render();
</script>
